<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" /> <!-- UTF-8 để hiển thị đúng tiếng Việt -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Hiển thị đúng trên mobile -->
    <title>Todo list - Login</title> <!-- Tiêu đề tab trình duyệt -->
    <link rel="stylesheet" href="/style/login.css" /> <!-- Nạp file CSS của trang Login -->
</head>

<body>
    <main class="card"> <!-- Khung form được căn giữa màn hình -->
        <h1 class="title">Todo list</h1> <!-- Tiêu đề đúng như mô tả trong đề -->
        <p id="message" class="message" role="status"></p> <!-- Thông báo chung: lỗi hoặc trạng thái -->

        <form id="login-form" class="form" novalidate> <!-- novalidate: tự validate bằng JS để hiện message đẹp -->
            <label class="label" for="email">Email</label> <!-- Nhãn cho ô email -->
            <input id="email" name="email" class="input" type="email" placeholder="you@example.com"
                autocomplete="email" /> <!-- Ô nhập email -->

            <p id="email-error" class="field-error"></p> <!-- Vùng báo lỗi riêng cho ô email -->

            <label class="label" for="password">Password</label> <!-- Nhãn cho ô mật khẩu -->
            <input id="password" name="password" class="input" type="password" placeholder="Your password"
                autocomplete="current-password" /><!-- Ô nhập mật khẩu -->

            <p id="password-error" class="field-error"></p> <!-- Vùng báo lỗi riêng cho ô mật khẩu -->

            <button id="login-button" class="button" type="submit">Login</button>
            <!-- Nút chính CÓ khung, chữ "Login" -->
        </form>

        <button id="resend-button" class="link-button hidden" type="button">
            <!-- Nút phụ: hiện khi tài khoản chưa kích hoạt -->
            Resend verification email
        </button>

        <a class="link" href="/page/signup.html">Sign Up</a> <!-- Link phụ KHÔNG khung, chữ "Sign Up" -->
    </main>
    <script src="/script/login.js" defer></script> <!-- defer: chạy JS sau khi HTML đã tải xong -->
</body>

</html>

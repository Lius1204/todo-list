<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"> <!-- UTF-8 để hiện đúng tiếng Việt -->
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- hiển thị đúng trên điện thoại -->
    <title>Todo list - Sign Up</title> <!-- tiêu đề trên tab trình duyệt -->
    <link rel="stylesheet" href="/style.css"> <!-- nạp file trang trí dùng chung -->
</head>

<body>
    <main class="card"> <!-- khung trắng căn giữa màn hình -->
        <h1 class="title">Todo list</h1> <!-- tiêu đề đúng như trong đề bài -->

        <!-- Chỗ hiện thông báo chung (đăng ký thành công hoặc lỗi) -->
        <p id="message" class="message"></p>

        <!-- novalidate: tắt kiểm tra tự động của trình duyệt để mình tự hiện lỗi cho đẹp -->
        <form id="signup-form" novalidate>

            <label class="label" for="email">Email</label> <!-- nhãn của ô email -->
            <input id="email" class="input" type="email" <!-- ô nhập email -->
            placeholder="you@example.com" autocomplete="email">
            <p id="email-error" class="field-error"></p> <!-- chỗ hiện lỗi riêng của ô email -->

            <label class="label" for="password">Password</label> <!-- nhãn của ô mật khẩu -->
            <input id="password" class="input" type="password" <!-- type=password để che ký tự khi gõ -->
            placeholder="At least 8 characters" autocomplete="new-password">
            <p id="password-error" class="field-error"></p> <!-- chỗ hiện lỗi riêng của ô mật khẩu -->

            <!-- Nút chính CÓ KHUNG (class button), chữ đúng là "SignUp" như trong ảnh -->
            <button id="signup-button" class="button" type="submit">SignUp</button>
        </form>

        <!-- Link phụ KHÔNG KHUNG (class link), nằm dưới nút SignUp, bấm vào là quay lại trang đăng nhập -->
        <a class="link" href="/login.html">Login</a>
    </main>

    <script src="/signup.js"></script> <!-- nạp script; đặt cuối body nên HTML đã sẵn sàng -->
</body>

</html>
